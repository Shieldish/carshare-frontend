stages:
  - install
  - test

variables:
  NEXT_PUBLIC_API_URL: "http://localhost:8081"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
  policy: pull-push

install:
  stage: install
  image: node:20-alpine
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

build-check:
  stage: test
  image: node:20-alpine
  needs: [install]
  script:
    - npm run build
  artifacts:
    paths:
      - .next/
    expire_in: 1 hour

lint:
  stage: test
  image: node:20-alpine
  needs: [install]
  script:
    - npm run lint

typecheck:
  stage: test
  image: node:20-alpine
  needs: [install]
  script:
    - npx tsc --noEmit

unit-tests:
  stage: test
  image: node:20-alpine
  needs: [install]
  script:
    - npx jest --passWithNoTests
