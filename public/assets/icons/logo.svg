<svg id="mainLogo" width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1"/>
        </linearGradient>
        <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#CBD5E1;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#94A3B8;stop-opacity:1"/>
        </linearGradient>
    </defs>
    
    <!-- Symbole principal -->
    <g transform="translate(30, 30)">
        <path d="M0 40 L15 25 L30 35 L45 15 L60 25 L60 45 L0 45 Z" fill="url(#logoGrad)" opacity="0.95"/>
        <rect x="5" y="30" width="4" height="4" fill="#60A5FA" opacity="0.9"/>
        <rect x="15" y="20" width="4" height="4" fill="#60A5FA" opacity="0.9"/>
        <rect x="25" y="25" width="4" height="4" fill="#60A5FA" opacity="0.9"/>
        <rect x="35" y="15" width="4" height="4" fill="#60A5FA" opacity="0.9"/>
        <rect x="45" y="20" width="4" height="4" fill="#60A5FA" opacity="0.9"/>
        <path d="M15 27 Q30 12 45 17" stroke="#F1F5F9" stroke-width="2.5" fill="none" opacity="0.8"/>
    </g>
    
    <!-- Texte principal -->
    <text x="120" y="65" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="url(#logoGrad)">
        Budaxdrive
